<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Same question, different answer</title>
<style>
:root{--bg:#F2F7FF;--blue:#1D5FD6;--navy:#0F2A5C;--sky:#DCEBFF;--mut:#5A6F94;--red:#E5484D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff,var(--bg) 40%,var(--sky));color:var(--navy);font-family:'DejaVu Sans',Verdana,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:10px 14px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.tag{text-align:center;letter-spacing:.35em;font-size:12px;font-weight:700;color:var(--blue)}
h1{text-align:center;font-size:clamp(20px,4.2vh,32px);margin:4px 0 2px;line-height:1.15}
h1 span{color:var(--blue)}
.sub{display:none}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--mut);margin:8px 0 5px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{border:2px solid var(--sky);background:#fff;border-radius:18px;padding:8px;display:flex;align-items:center;gap:10px;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:.25s}
.person.on{border-color:var(--blue);box-shadow:0 6px 20px rgba(29,95,214,.18)}
.person svg{flex:none;width:44px;height:44px}
.person b{display:block;font-size:14px}
.person small{color:var(--mut);font-size:12px;font-weight:700}
.seg{display:flex;gap:6px;background:#fff;border:2px solid var(--sky);padding:5px;border-radius:999px}
.seg button{flex:1;border:0;border-radius:999px;padding:8px 4px;font:inherit;font-weight:700;font-size:12px;color:var(--mut);background:transparent;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.stage{margin-top:10px;background:#fff;border:2px solid var(--sky);border-radius:22px;padding:12px;flex:1;min-height:0;overflow-y:auto;box-shadow:0 10px 30px rgba(29,95,214,.08)}
.row{display:flex;align-items:flex-end;gap:8px;margin-bottom:8px;animation:in .35s ease both}
.row.me{flex-direction:row-reverse}
.row svg{flex:none;width:32px;height:32px}
.bub{max-width:80%;padding:9px 13px;border-radius:18px;font-weight:700;font-size:14px;line-height:1.35}
.row.ai .bub{background:var(--sky);border-bottom-left-radius:6px}
.row.me .bub{background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.row.ai.ask .bub{background:#fff;border:2px solid var(--blue)}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--blue);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.known{font-size:12px;font-weight:700;color:var(--blue);background:var(--sky);border-radius:999px;padding:6px 12px;display:inline-block;margin:0 0 8px 40px;animation:in .35s ease both}
.react{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 12px;border-radius:14px;font-weight:700;font-size:13px;animation:in .4s ease both}
.react.bad{background:#FFECEC;color:#B3262B}.react.good{background:#E6F0FF;color:var(--navy)}
.react em{font-style:normal;font-size:22px}
.react small{display:block;color:var(--mut);font-weight:700;margin-top:2px}
.bar{margin-top:10px;text-align:center}
.run{border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-weight:800;padding:11px 28px;cursor:pointer;font-size:15px}
.run:disabled{opacity:.5;cursor:default}
.foot{margin-top:10px;text-align:center;background:var(--navy);color:#fff;border-radius:18px;padding:10px;font-weight:800;font-size:15px}
.foot span{color:#9CC4FF;display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">AI EXPLAINED SIMPLY</div>
  <h1>Same question,<br><span>different answer.</span></h1>
  <p class="sub">Pick a person, choose how the AI behaves, then press Ask.</p>

  <div class="lbl">WHO IS ASKING?</div>
  <div class="people" id="people"></div>

  <div class="lbl">HOW DOES THE AI BEHAVE?</div>
  <div class="seg" id="mode">
    <button type="button" data-v="none" class="on">Just guesses</button>
    <button type="button" data-v="ctx">Knows the person</button>
    <button type="button" data-v="ask">Asks first</button>
  </div>

  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="bar"><button class="run" id="run" type="button">▶ Ask</button></div>

  <div class="foot">Humans ask before they answer.<span>Good AI does too.</span></div>
</div>

<script>
(function(){
  var P={
    'new':{name:'New joiner',sub:'Month 1, on probation',skin:'#F0C4A0',shirt:'#5B8DEF',
      known:'Knows: new joiner · month 1 · on probation',
      ctx:'Good question! Carry-forward starts after probation, so it doesn’t apply to you yet. I can show you the date you become eligible.',
      q:'Quick check before I answer: are you still on probation?',a:'Yes, I’m in my first month.'},
    'lead':{name:'Manager',sub:'10 years at the company',skin:'#C98E64',shirt:'#0F2A5C',
      known:'Knows: manager · 10 years · 8 unused days',
      ctx:'Yes! You can carry forward up to the limit, and you have 8 unused days. Want me to submit the request?',
      q:'Quick check before I answer: are you a confirmed employee?',a:'Yes, 10 years now.'}
  };
  var who='new',mode='none',busy=false;
  var stage=document.getElementById('stage'),run=document.getElementById('run'),people=document.getElementById('people');

  function face(skin,shirt,mood){
    var mouth=mood==='sad'?'<path d="M20 43 q8-7 16 0" stroke="#7A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>':
      mood==='happy'?'<path d="M19 38 q9 10 18 0" stroke="#7A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>':
      '<path d="M22 41 h12" stroke="#7A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    var brows=mood==='sad'?'<path d="M16 24 l9 -3 M40 24 l-9 -3" stroke="#3A2A22" stroke-width="2.5" stroke-linecap="round"/>':'';
    return '<svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#EAF2FF"/><path d="M6 56 q0-18 22-18 q22 0 22 18z" fill="'+shirt+'"/>'+
      '<rect x="24" y="32" width="8" height="8" fill="'+skin+'"/><circle cx="28" cy="26" r="14" fill="'+skin+'"/>'+
      '<path d="M14 24 q2-14 14-14 q12 0 14 14 q-6-8-14-8 q-8 0-14 8z" fill="#2B1F1A"/>'+
      '<circle cx="22" cy="28" r="2.2" fill="#15173F"/><circle cx="34" cy="28" r="2.2" fill="#15173F"/>'+brows+mouth+'</svg>';
  }
  function bot(){
    return '<svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#1D5FD6"/><rect x="13" y="16" width="30" height="24" rx="10" fill="#fff"/>'+
      '<circle cx="22" cy="27" r="3" fill="#1D5FD6"/><circle cx="34" cy="27" r="3" fill="#1D5FD6"/><path d="M22 34 q6 5 12 0" stroke="#1D5FD6" stroke-width="2.5" fill="none" stroke-linecap="round"/>'+
      '<path d="M28 16 v-6" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="28" cy="9" r="3" fill="#fff"/></svg>';
  }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function add(h){var d=document.createElement('div');d.innerHTML=h;var n=d.firstChild;stage.appendChild(n);stage.scrollTop=stage.scrollHeight;return n}
  function me(t){return '<div class="row me">'+face(P[who].skin,P[who].shirt,'neutral')+'<div class="bub">'+t+'</div></div>'}
  function ai(t,c){return '<div class="row ai '+(c||'')+'">'+bot()+'<div class="bub">'+t+'</div></div>'}
  async function say(t,c){
    var n=add('<div class="row ai">'+bot()+'<div class="bub"><div class="dots"><span></span><span></span><span></span></div></div></div>');
    await sleep(900);n.remove();add(ai(t,c));
  }
  function draw(mood){
    people.innerHTML='';
    Object.keys(P).forEach(function(k){
      var p=P[k],b=document.createElement('button');
      b.type='button';b.className='person'+(k===who?' on':'');
      b.innerHTML=face(p.skin,p.shirt,k===who?mood:'neutral')+'<div><b>'+p.name+'</b><small>'+p.sub+'</small></div>';
      b.onclick=function(){if(busy)return;who=k;reset()};
      people.appendChild(b);
    });
  }
  function reset(){
    draw('neutral');stage.innerHTML='';
    add(me('Can I carry forward my unused leave?'));
  }
  document.getElementById('mode').onclick=function(e){
    if(busy||!e.target.dataset.v)return;mode=e.target.dataset.v;
    document.querySelectorAll('#mode button').forEach(function(b){b.classList.toggle('on',b.dataset.v===mode)});reset();
  };
  async function go(){
    if(busy)return;busy=true;run.disabled=true;reset();
    var p=P[who],mood='happy',r;
    await sleep(500);
    if(mode==='none'){
      await say('Sure! Yes, you can carry forward up to the limit.');
      if(who==='new'){mood='sad';r='<div class="react bad"><em>😕</em><div>“Hmm, that doesn’t sound right for me.”<small>Wrong answer, said with full confidence.</small></div></div>'}
      else{r='<div class="react good"><em>🙂</em><div>“Great, that matches my situation.”<small>Right, but only by luck. The AI never asked who I am.</small></div></div>'}
    }else if(mode==='ctx'){
      add('<div class="known">'+p.known+'</div>');await sleep(700);
      await say(p.ctx);
      r='<div class="react good"><em>🙂</em><div>“Thanks, that’s exactly what I needed.”<small>The same AI, now with the right context.</small></div></div>';
    }else{
      await say(p.q,'ask');await sleep(500);
      add(me(p.a));await sleep(500);
      await say(p.ctx);
      r='<div class="react good"><em>🙂</em><div>“Thanks for checking first.”<small>Like my cab driver asking: “Which terminal?”</small></div></div>';
    }
    add(r);draw(mood);
    busy=false;run.disabled=false;run.textContent='↻ Ask again';
  }
  run.onclick=go;reset();
})();
</script>
</body>
</html>
